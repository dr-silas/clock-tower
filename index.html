<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>黒鍵のバベル ― BABEL OF BLACK KEYS ―</title>
  <style>
    :root {
      --bg-void: #140e0a;
      --bg-paper: #fcf8ef;
      --bg-card: #efe2c8;
      --ink-dark: #231710;
      --ink-muted: #584233;
      --brass-primary: #9a6c28;
      --brass-light: #d6ad60;
      --brass-shine: #f2d593;
      --brass-dark: #57380e;
      --accent-crimson: #8f2222;
      --accent-crimson-light: #b83232;
      --accent-emerald: #1f5c39;
      --accent-emerald-light: #2e7d50;
      --accent-purple: #5b2c6f;
      --accent-royal: #264873;
      --border-antique: #b4935e;
      --shadow-deep: 0 22px 50px rgba(10, 6, 3, 0.65);
      --radius-lg: 16px;
      --radius-md: 10px;
      --radius-sm: 6px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background-color: var(--bg-void);
      background-image:
        radial-gradient(ellipse at 50% 0%, rgba(154, 108, 40, 0.25) 0%, transparent 65%),
        radial-gradient(circle at 15% 85%, rgba(143, 34, 34, 0.16) 0%, transparent 50%),
        repeating-linear-gradient(
          45deg,
          rgba(255, 255, 255, 0.015) 0px,
          rgba(255, 255, 255, 0.015) 1px,
          transparent 1px,
          transparent 8px
        );
      color: var(--ink-dark);
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", Georgia, serif;
      line-height: 1.6;
      transition: background-color 0.4s ease;
    }

    /* 高難度「逆さまのバベル」時のダーク紫＆反転世界テーマ */
    body.abyss-theme {
      --bg-void: #0d0712;
      --brass-primary: #7d3c98;
      --brass-light: #c39bd3;
      --brass-shine: #ebdef0;
      --brass-dark: #4a235a;
      --border-antique: #8e6ba1;
      background-image:
        radial-gradient(ellipse at 50% 100%, rgba(125, 60, 152, 0.34) 0%, transparent 65%),
        radial-gradient(circle at 85% 15%, rgba(143, 34, 34, 0.22) 0%, transparent 55%);
    }

    body.abyss-theme .antique-frame {
      background: #f6f0fa;
      background-image:
        radial-gradient(circle at 50% 100%, rgba(155, 89, 182, 0.16) 0%, transparent 60%),
        linear-gradient(180deg, #faf5fd 0%, #ede2f5 100%);
      outline-color: #2c1338;
    }

    .bg-gear-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
      opacity: 0.15;
    }

    .bg-gear {
      position: absolute;
      fill: none;
      stroke: var(--brass-light);
      stroke-width: 1.5;
    }

    .gear-left {
      width: 360px;
      height: 360px;
      top: -90px;
      left: -100px;
      animation: spinSlow 90s linear infinite;
    }

    .gear-right {
      width: 440px;
      height: 440px;
      bottom: -130px;
      right: -120px;
      animation: spinSlowReverse 120s linear infinite;
    }

    @keyframes spinSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes spinSlowReverse { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }

    .app-shell {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 14px 12px 44px;
    }

    .antique-frame {
      background: var(--bg-paper);
      background-image:
        radial-gradient(circle at 50% 0%, rgba(214, 173, 96, 0.15) 0%, transparent 60%),
        linear-gradient(180deg, #fdfaf2 0%, #f5ebd6 100%);
      border: 2px solid var(--brass-primary);
      outline: 4px solid #382618;
      outline-offset: -8px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-deep), inset 0 0 36px rgba(154, 108, 40, 0.22);
      padding: 24px 22px 22px;
      position: relative;
      overflow: hidden;
    }

    .corner-plate {
      position: absolute;
      width: 24px;
      height: 24px;
      pointer-events: none;
      z-index: 2;
    }
    .corner-plate::before, .corner-plate::after {
      content: "";
      position: absolute;
      background: linear-gradient(135deg, var(--brass-shine), var(--brass-primary));
    }
    .corner-tl { top: 10px; left: 10px; }
    .corner-tl::before { top: 0; left: 0; width: 20px; height: 3px; }
    .corner-tl::after { top: 0; left: 0; width: 3px; height: 20px; }
    .corner-tr { top: 10px; right: 10px; }
    .corner-tr::before { top: 0; right: 0; width: 20px; height: 3px; }
    .corner-tr::after { top: 0; right: 0; width: 3px; height: 20px; }
    .corner-bl { bottom: 10px; left: 10px; }
    .corner-bl::before { bottom: 0; left: 0; width: 20px; height: 3px; }
    .corner-bl::after { bottom: 0; left: 0; width: 3px; height: 20px; }
    .corner-br { bottom: 10px; right: 10px; }
    .corner-br::before { bottom: 0; right: 0; width: 20px; height: 3px; }
    .corner-br::after { bottom: 0; right: 0; width: 3px; height: 20px; }

    .antique-frame.shake { animation: trapShake 0.45s cubic-bezier(.36,.07,.19,.97) both; }
    @keyframes trapShake {
      10%, 90% { transform: translate3d(-4px, 0, 0); }
      20%, 80% { transform: translate3d(6px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
      40%, 60% { transform: translate3d(8px, 0, 0); }
    }

    /* ヘッダー */
    header {
      text-align: center;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }

    .top-utility-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }

    .utility-left, .utility-right {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    .meta-gear-pill {
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: bold;
      color: #fffaf0;
      background: linear-gradient(180deg, #5e4124 0%, #3b2714 100%);
      border: 1px solid var(--brass-light);
      padding: 3px 11px;
      border-radius: 999px;
      cursor: pointer;
    }

    .mode-switch-btn {
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 3px 11px;
      border-radius: 999px;
      cursor: pointer;
      border: 1px solid var(--border-antique);
      background: #fffdf8;
      color: var(--ink-dark);
    }

    .mode-switch-btn.locked-mode {
      opacity: 0.65;
      background: #e5dccb;
      color: var(--ink-muted);
    }

    .mode-switch-btn.abyss-active {
      background: linear-gradient(180deg, #6c3483 0%, #4a235a 100%);
      border-color: #d7bde2;
      color: #fff;
      box-shadow: 0 0 10px rgba(142, 68, 173, 0.45);
    }

    .mini-util-btn {
      font-family: inherit;
      font-size: 0.74rem;
      font-weight: bold;
      color: var(--ink-dark);
      background: #f5ebd6;
      border: 1px solid var(--border-antique);
      padding: 3px 10px;
      border-radius: 999px;
      cursor: pointer;
    }

    .mini-util-btn:hover { background: #e8d5b1; }

    .subtitle-badge {
      display: inline-block;
      font-size: 0.68rem;
      letter-spacing: 0.24em;
      color: #fffaf0;
      background: linear-gradient(180deg, #4b3321 0%, #2c1d12 100%);
      border: 1px solid var(--brass-light);
      padding: 2px 16px;
      border-radius: 999px;
      margin-bottom: 4px;
    }

    body.abyss-theme .subtitle-badge {
      background: linear-gradient(180deg, #5b2c6f 0%, #2c1338 100%);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.45rem, 4.2vw, 1.95rem);
      color: var(--ink-dark);
      letter-spacing: 0.12em;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.85);
    }

    /* HUDバー */
    .hud-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: linear-gradient(180deg, #3a2719 0%, #261910 100%);
      border: 1px solid var(--brass-light);
      border-radius: var(--radius-md);
      padding: 9px 14px;
      margin-bottom: 10px;
      color: #fcf6e8;
    }

    body.abyss-theme .hud-bar {
      background: linear-gradient(180deg, #2e183b 0%, #1c0d26 100%);
    }

    .floor-info {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .floor-badge {
      background: linear-gradient(180deg, var(--brass-shine) 0%, var(--brass-primary) 100%);
      color: #1f1309;
      font-weight: bold;
      font-size: 0.9rem;
      padding: 3px 11px;
      border-radius: var(--radius-sm);
    }

    .room-type-tag {
      font-size: 0.78rem;
      padding: 2px 9px;
      border-radius: 999px;
      border: 1px solid rgba(214, 173, 96, 0.5);
      background: rgba(255, 255, 255, 0.08);
      color: #f3e2c1;
    }

    .hud-right-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .gold-pill {
      font-size: 0.8rem;
      font-weight: bold;
      color: var(--brass-shine);
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(214, 173, 96, 0.45);
      padding: 3px 10px;
      border-radius: 999px;
    }

    .hp-display {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(15, 9, 5, 0.6);
      border: 1px solid rgba(214, 173, 96, 0.5);
      padding: 3px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
    }

    .hearts {
      display: inline-flex;
      gap: 3px;
      font-size: 1.08rem;
      line-height: 1;
    }
    .heart-full { color: #e04848; text-shadow: 0 0 8px rgba(224, 72, 72, 0.65); }
    .heart-empty { color: #5c4938; }

    /* パッシブ遺物＆消耗品バー */
    .build-panel {
      background: rgba(239, 226, 200, 0.65);
      border: 1px solid var(--border-antique);
      border-radius: var(--radius-md);
      padding: 9px 12px;
      margin-bottom: 12px;
    }

    body.abyss-theme .build-panel {
      background: rgba(230, 214, 242, 0.65);
    }

    .build-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .passive-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      flex: 1;
    }

    .passive-label {
      font-size: 0.75rem;
      font-weight: bold;
      color: var(--brass-dark);
    }

    .relic-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #fffdf8;
      border: 1px solid var(--brass-primary);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.76rem;
      font-weight: bold;
      color: var(--ink-dark);
      cursor: help;
    }

    .relic-chip.cursed {
      background: #35193d;
      border-color: #b777d6;
      color: #f6e8fc;
    }

    .consumable-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .use-item-btn {
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: bold;
      background: linear-gradient(180deg, #fffdf8 0%, #ead8b5 100%);
      border: 1px solid var(--brass-dark);
      border-radius: 6px;
      padding: 4px 9px;
      cursor: pointer;
      color: var(--ink-dark);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .use-item-btn:hover:not(:disabled) { background: #dfc798; }
    .use-item-btn:disabled { opacity: 0.42; cursor: not-allowed; }

    /* 環境モディファイアバナー */
    .modifier-banner {
      display: none;
      border-radius: var(--radius-sm);
      padding: 7px 12px;
      margin-bottom: 10px;
      font-size: 0.83rem;
      font-weight: bold;
      align-items: center;
      gap: 8px;
    }
    .modifier-banner.show { display: flex; }
    .modifier-curse {
      background: #f5ebf8;
      border: 1px solid #7d3c98;
      border-left: 5px solid #5b2c6f;
      color: #4a235a;
    }
    .modifier-blessing {
      background: #ebf7f0;
      border: 1px solid var(--accent-emerald);
      border-left: 5px solid var(--accent-emerald);
      color: #164429;
    }

    /* 碑文カード */
    .story-box {
      background: #fffdf8;
      border: 1px solid var(--border-antique);
      border-top: 3px solid var(--brass-primary);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      margin-bottom: 14px;
      box-shadow: 0 4px 12px rgba(42, 28, 20, 0.07);
    }

    .problem-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .problem-title {
      font-size: 1.05rem;
      font-weight: bold;
      margin: 0;
      color: var(--brass-dark);
    }

    .clues-list {
      list-style: none;
      margin: 8px 0 0;
      padding: 0;
      display: grid;
      gap: 7px;
    }

    .clues-list li {
      background: #f7eedc;
      border: 1px solid rgba(154, 108, 40, 0.38);
      border-radius: var(--radius-sm);
      padding: 8px 11px;
      font-size: 0.92rem;
      color: #1f140d;
      display: flex;
      align-items: flex-start;
      gap: 9px;
      cursor: pointer;
      user-select: none;
    }

    body.abyss-theme .clues-list li {
      background: #f3eaf8;
      border-color: rgba(125, 60, 152, 0.35);
    }

    .clues-list li.checked-clue { opacity: 0.52; text-decoration: line-through; }

    .clue-seal {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      height: 22px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #b53838, #781919);
      color: #fffaf0;
      font-size: 0.74rem;
      font-weight: bold;
    }

    /* 鍵台座 */
    .workspace {
      background: linear-gradient(180deg, #321f19 0%, #231510 100%);
      border: 2px solid var(--brass-primary);
      border-radius: var(--radius-lg);
      padding: 14px 13px 16px;
      margin-bottom: 14px;
      box-shadow: inset 0 4px 18px rgba(0, 0, 0, 0.65);
    }

    body.abyss-theme .workspace {
      background: linear-gradient(180deg, #271433 0%, #180b21 100%);
    }

    .workspace-header {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 10px;
      padding: 0 4px;
    }

    .workspace-label { font-size: 0.84rem; font-weight: bold; color: #f3e2c1; }
    .workspace-sub { font-size: 0.74rem; color: #cbb48e; }

    .keys-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(124px, 1fr));
      gap: 9px;
    }

    .key-card {
      background: linear-gradient(180deg, #fffdf9 0%, #f1e3c6 100%);
      border: 2px solid #9e7840;
      border-radius: var(--radius-md);
      padding: 9px 7px 8px;
      color: var(--ink-dark);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      transition: transform 0.15s ease, border-color 0.15s ease, opacity 0.18s ease;
      user-select: none;
    }

    .key-card:hover:not(.locked-card) {
      transform: translateY(-3px);
      border-color: var(--brass-shine);
    }

    .key-card.selected {
      border-color: #d94343;
      background: linear-gradient(180deg, #fff9f7 0%, #fae3dc 100%);
      transform: translateY(-3px);
      box-shadow: 0 0 0 3px rgba(217, 67, 67, 0.45), 0 10px 20px rgba(0, 0, 0, 0.55);
    }

    .key-card.selected::before {
      content: "選択中";
      position: absolute;
      top: -9px;
      right: 7px;
      background: var(--accent-crimson);
      color: #fff;
      font-size: 0.65rem;
      font-weight: bold;
      padding: 1px 7px;
      border-radius: 999px;
    }

    .key-card.eliminated {
      opacity: 0.42;
      background: #cfc2ab;
      border-style: dashed;
      border-color: #7d6b53;
      transform: none;
      box-shadow: none;
    }

    .key-card.correct-reveal {
      border-color: var(--accent-emerald);
      background: linear-gradient(180deg, #f2fbf6 0%, #d4eedf 100%);
      box-shadow: 0 0 0 3px rgba(46, 125, 80, 0.5);
    }

    .pos-tag {
      font-size: 0.72rem;
      font-weight: bold;
      color: var(--brass-dark);
      background: rgba(154, 108, 40, 0.16);
      padding: 1px 7px;
      border-radius: 4px;
      margin-bottom: 5px;
      width: 100%;
      display: flex;
      justify-content: space-between;
    }

    .key-emblem-ring {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fffdf8, #e6d1a7);
      border: 1.5px solid var(--brass-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 2px 0 5px;
    }

    .key-icon { font-size: 1.38rem; line-height: 1; }
    .key-name { font-size: 0.88rem; font-weight: bold; color: #1f140d; }
    .key-sub { font-size: 0.74rem; color: #4f3a2c; margin-top: 2px; }

    .memo-toggle {
      margin-top: 7px;
      width: 100%;
      font-family: inherit;
      font-size: 0.71rem;
      font-weight: bold;
      padding: 3px 5px;
      border-radius: 4px;
      border: 1px solid var(--border-antique);
      background: rgba(255, 253, 248, 0.85);
      color: var(--ink-muted);
      cursor: pointer;
    }

    /* 判定バナー */
    .message-banner {
      display: none;
      border-radius: var(--radius-md);
      padding: 12px 15px;
      margin-bottom: 14px;
      font-size: 0.91rem;
      font-weight: bold;
      line-height: 1.55;
    }
    .message-banner.show { display: block; }
    .message-warning { background: #fef5e7; border: 1.5px solid #c86d1f; color: #7a3b08; }
    .message-trap { background: #fdf0ef; border: 2px solid var(--accent-crimson); color: #7d1818; }
    .message-success { background: #edf9f2; border: 2px solid var(--accent-emerald); color: #15472a; }
    .message-hint { background: #f8f2e4; border: 1.5px solid var(--brass-primary); color: var(--ink-dark); font-weight: normal; }
    .message-relic { background: #eef4fc; border: 1.5px solid var(--accent-royal); color: #173254; }

    /* アクションボタン */
    .actions-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 9px;
    }

    .btn {
      appearance: none;
      font-family: inherit;
      font-size: 0.91rem;
      font-weight: bold;
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      border: 1.5px solid transparent;
      min-height: 44px;
    }

    .btn-primary {
      background: linear-gradient(180deg, var(--brass-shine) 0%, var(--brass-primary) 100%);
      border-color: var(--brass-dark);
      color: #1f1309;
    }
    body.abyss-theme .btn-primary {
      color: #fff;
    }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-secondary {
      background: linear-gradient(180deg, #fffdf8 0%, #efe1c6 100%);
      border-color: var(--border-antique);
      color: var(--ink-dark);
    }

    .btn-next {
      background: linear-gradient(180deg, var(--accent-emerald-light) 0%, var(--accent-emerald) 100%);
      border-color: #123b23;
      color: #fffdf8;
    }

    .btn-abyss {
      background: linear-gradient(180deg, #8e44ad 0%, #5b2c6f 100%);
      border-color: #2c1338;
      color: #fffdf8;
      box-shadow: 0 4px 14px rgba(91, 44, 111, 0.45);
    }

    .btn-danger {
      background: linear-gradient(180deg, var(--accent-crimson-light) 0%, var(--accent-crimson) 100%);
      border-color: #541010;
      color: #fffdf8;
    }

    /* モーダル */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(12, 8, 5, 0.82);
      backdrop-filter: blur(3px);
      align-items: center;
      justify-content: center;
      padding: 14px;
      overflow-y: auto;
    }
    .modal-overlay.show { display: flex; }

    .modal-box {
      background: linear-gradient(180deg, #fdfaf2 0%, #f1e2c4 100%);
      border: 3px solid var(--brass-primary);
      outline: 3px solid #2c1c10;
      outline-offset: -7px;
      border-radius: var(--radius-lg);
      max-width: 620px;
      width: 100%;
      padding: 24px 20px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8);
      text-align: center;
    }

    .modal-title {
      margin: 0 0 6px;
      font-size: 1.25rem;
      color: var(--brass-dark);
    }

      <p class="modal-sub" id="workshopGearText">探索で集めた「魔導の歯車」を消費し、次回以降の探索を永久に強化します。</p>

  <script>
    (function () {
      "use strict";

      const TOTAL_FLOORS = 20;
      const META_KEY = "babel_black_keys_meta_v1";

      // --- 効果音エンジン ---
      const SoundFX = (() => {
        let ctx = null;
        let enabled = true;
        function ensure() {
          if (!enabled) return null;
          if (!ctx) {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (AC) ctx = new AC();
          }
          if (ctx && ctx.state === "suspended") ctx.resume();
          return ctx;
        }
        function tone(f, type, dur, delay = 0, vol = 0.1, endF = null) {
          const a = ensure();
          if (!a) return;
          const t = a.currentTime + delay;
          const o = a.createOscillator();
          const g = a.createGain();
          o.type = type;
          o.frequency.setValueAtTime(f, t);
          if (endF) o.frequency.exponentialRampToValueAtTime(endF, t + dur);
          g.gain.setValueAtTime(0.001, t);
          g.gain.linearRampToValueAtTime(vol, t + 0.01);
          g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
          o.connect(g);
          g.connect(a.destination);
          o.start(t);
          o.stop(t + dur + 0.02);
        }
        return {
          toggle: () => { enabled = !enabled; return enabled; },
          isEnabled: () => enabled,
          select: () => tone(600, "triangle", 0.06, 0, 0.07),
          memo: () => tone(310, "sine", 0.05, 0, 0.05),
          unlock: () => {
            tone(261.6, "triangle", 0.35, 0, 0.11);
            tone(329.6, "triangle", 0.35, 0.06, 0.11);
            tone(392.0, "triangle", 0.4, 0.12, 0.11);
            tone(523.3, "sine", 0.55, 0.18, 0.13);
          },
          trap: () => {
            tone(140, "sawtooth", 0.38, 0, 0.15, 45);
            tone(90, "square", 0.34, 0.04, 0.13, 35);
          },
          relic: () => {
            tone(523.3, "sine", 0.2, 0, 0.1);
            tone(784.0, "triangle", 0.3, 0.08, 0.1);
          }
        };
      })();

      // --- パッシブ遺物マスターデータ ---
      const RELIC_POOL = [
        {
          id: "compass",
          icon: "🧭",
          name: "真鍮の羅針盤",
          desc: "毎層の開始時、偽物の鍵1本を自動で看破して除外する。"
        },
        {
          id: "vampire_ring",
          icon: "🩸",
          name: "吸血の鍵束",
          desc: "「一発開錠」を3回達成するたび、最大HP+1＆HP1回復。"
        },
        {
          id: "alchemist_lens",
          icon: "🔬",
          name: "錬金術師の単眼鏡",
          desc: "「手がかりの助言」を使用しても、一発開錠ボーナスが途切れなくなる。"
        },
        {
          id: "chrono_watch",
          icon: "⏱️",
          name: "狂気の懐中時計",
          desc: "残りHPが1のとき、各層で最初のミスダメージを1度だけ無効化する。"
        },
        {
          id: "merchant_pouch",
          icon: "💰",
          name: "強欲の革袋",
          desc: "階層突破時の獲得ゴールドが +25G 増加する。"
        },
        {
          id: "parity_scale",
          icon: "⚖️",
          name: "偶奇の天秤",
          desc: "本物の鍵が「奇数番目」にある階では、開錠時に追加で15G得る。"
        },
        {
          id: "sage_quill",
          icon: "🪶",
          name: "賢者の羽ペン",
          desc: "毎層の開始時、最初の条件文1つが最初から「確認済み」になる。"
        },
        {
          id: "crimson_idol",
          icon: "🗿",
          name: "修羅の偶像",
          desc: "ミス時のダメージが+1される代わり、報酬の遺物選択肢が常に+1増える。",
          cursed: true
        }
      ];

      // --- メタプログレッション（永続強化） ---
      const META_UPGRADES = [
        {
          id: "maxHpUp",
          name: "頑強なる心臓",
          desc: "探索開始時の最大HPが +1 される（最大+2）",
          maxLevel: 2,
          baseCost: 40
        },
        {
          id: "startGold",
          name: "王家の支度金",
          desc: "探索開始時の所持ゴールドが +30G される（最大+90G）",
          maxLevel: 3,
          baseCost: 30
        },
        {
          id: "startMonocle",
          name: "予備の単眼鏡",
          desc: "探索開始時の「真実の単眼鏡」所持数が +1 される（最大+2）",
          maxLevel: 2,
          baseCost: 35
        },
        {
          id: "startRelic",
          name: "継承された遺物",
          desc: "探索開始時にランダムなパッシブ遺物を1つ所持して出発する",
          maxLevel: 1,
          baseCost: 70
        }
      ];

      function loadMeta() {
        try {
          const raw = localStorage.getItem(META_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            return {
              gears: parsed.gears || 0,
              abyssUnlocked: Boolean(parsed.abyssUnlocked),
              abyssCleared: Boolean(parsed.abyssCleared),
              upgrades: Object.assign(
                { maxHpUp: 0, startGold: 0, startMonocle: 0, startRelic: 0 },
                parsed.upgrades || {}
              )
            };
          }
        } catch {}
        return {
          gears: 0,
          abyssUnlocked: false,
          abyssCleared: false,
          upgrades: { maxHpUp: 0, startGold: 0, startMonocle: 0, startRelic: 0 }
        };
      }

      function saveMeta(meta) {
        try {
          localStorage.setItem(META_KEY, JSON.stringify(meta));
        } catch {}
      }

      let metaState = loadMeta();

      // --- プロシージャル（自動生成）パズルエンジン ---
      const THEMES = [
        {
          names: ["太陽の鍵", "三日月の鍵", "明星の鍵", "彗星の鍵", "日蝕の鍵", "極光の鍵", "天球の鍵", "白夜の鍵", "黄昏の鍵"],
          icons: ["☀️", "🌙", "⭐", "☄️", "🌑", "🌌", "🪐", "🌅", "🌆"],
          materials: ["黄金", "白銀", "青銅", "黒鉄"],
          shapes: ["丸頭", "角頭", "菱頭"]
        },
        {
          names: ["紅蓮の鍵", "蒼氷の鍵", "翠風の鍵", "琥珀の鍵", "紫電の鍵", "白光の鍵", "漆黒の鍵", "桜花の鍵", "深海の鍵"],
          icons: ["🔥", "❄️", "🍃", "⚡", "🔮", "✨", "🖤", "🌸", "🌊"],
          materials: ["紅玉", "蒼玉", "翠玉", "真珠"],
          shapes: ["長柄", "短柄", "螺旋柄"]
        },
        {
          names: ["獅子の鍵", "大鷲の鍵", "大蛇の鍵", "白鹿の鍵", "黒狼の鍵", "梟の鍵", "竜の鍵", "一角獣の鍵", "鳳凰の鍵"],
          icons: ["🦁", "🦅", "🐍", "🦌", "🐺", "🦉", "🐉", "🦄", "🐦‍🔥"],
          materials: ["真鍮", "白銀", "黒檀", "象牙"],
          shapes: ["重厚", "軽量", "精密"]
        }
      ];

      function shuffle(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function getKeyCountForFloor(floorNum, isAbyss) {
        if (!isAbyss) {
          if (floorNum <= 4) return 4;
          if (floorNum <= 9) return 5;
          if (floorNum <= 14) return 6;
          return 7;
        } else {
          if (floorNum <= 3) return 5;
          if (floorNum <= 7) return 6;
          if (floorNum <= 12) return 7;
          if (floorNum <= 16) return 8;
          return 9;
        }
      }

      function formatFloorName(floorNum, isAbyss) {
        return isAbyss ? `逆層 B${floorNum}` : `第${floorNum}層`;
      }

      function generateFloorPuzzle(floorNum, roomType, modifier, isAbyss) {
        const keyCount = getKeyCountForFloor(floorNum, isAbyss);
        const theme = THEMES[(floorNum + Math.floor(Math.random() * THEMES.length)) % THEMES.length];
        const names = shuffle(theme.names).slice(0, keyCount);
        const icons = shuffle(theme.icons).slice(0, keyCount);

        const liarFloors = isAbyss ? [5, 10, 15, 20] : [7, 13, 20];
        if (liarFloors.includes(floorNum)) {
          return isAbyss
            ? generateAbyssLiarPuzzle(floorNum, keyCount, names, icons)
            : generateLiarPuzzle(floorNum, keyCount, names, icons);
        }

        for (let attempt = 0; attempt < 50; attempt++) {
          const keys = [];
          for (let i = 0; i < keyCount; i++) {
            const mat = theme.materials[Math.floor(Math.random() * theme.materials.length)];
            const shp = theme.shapes[Math.floor(Math.random() * theme.shapes.length)];
            keys.push({
              id: `k${i + 1}`,
              index: i,
              pos: `左から${i + 1}`,
              name: names[i],
              material: mat,
              shape: shp,
              sub: `${mat}・${shp}`,
              icon: icons[i]
            });
          }

          const answerIdx = Math.floor(Math.random() * keyCount);
          const ansKey = keys[answerIdx];
          const candidateRules = [];

          theme.materials.forEach((m) => {
            if (m !== ansKey.material && keys.some((k) => k.material === m)) {
              candidateRules.push({
                text: `「${m}」でできた鍵はすべて偽物である。`,
                filter: (k) => k.material !== m
              });
            }
          });

          theme.shapes.forEach((s) => {
            if (s !== ansKey.shape && keys.some((k) => k.shape === s)) {
              candidateRules.push({
                text: `「${s}」の鍵はすべて扉を開けることができない。`,
                filter: (k) => k.shape !== s
              });
            }
          });

          if (answerIdx > 0) {
            const refIdx = Math.floor(Math.random() * answerIdx);
            candidateRules.push({
              text: `本物の鍵は、「${keys[refIdx].name}（${keys[refIdx].pos}）」よりも右側に置かれている。`,
              filter: (k) => k.index > refIdx
            });
          }
          if (answerIdx < keyCount - 1) {
            const refIdx = answerIdx + 1 + Math.floor(Math.random() * (keyCount - 1 - answerIdx));
            candidateRules.push({
              text: `本物の鍵は、「${keys[refIdx].name}（${keys[refIdx].pos}）」よりも左側に置かれている。`,
              filter: (k) => k.index < refIdx
            });
          }

          if (answerIdx !== 0 && answerIdx !== keyCount - 1) {
            candidateRules.push({
              text: `本物の鍵は、両端（左から1・左から${keyCount}）には置かれていない。`,
              filter: (k) => k.index !== 0 && k.index !== keyCount - 1
            });
          }

          const ansIsEven = (answerIdx + 1) % 2 === 0;
          candidateRules.push({
            text: ansIsEven
              ? `奇数番目（1・3・5…）にある鍵はすべて罠である。`
              : `偶数番目（2・4・6…）にある鍵はすべて罠である。`,
            filter: (k) => ((k.index + 1) % 2 === 0) === ansIsEven
          });

          const trapCandidates = keys.filter((k) => Math.abs(k.index - answerIdx) > 1);
          if (trapCandidates.length > 0) {
            const cursedTrap = trapCandidates[Math.floor(Math.random() * trapCandidates.length)];
            candidateRules.push({
              text: `「${cursedTrap.name}」は呪われており、その鍵自身とすぐ左右に隣接する鍵はすべて偽物である。`,
              filter: (k) => Math.abs(k.index - cursedTrap.index) > 1
            });
          }

          if (isAbyss && keyCount >= 6) {
            const mid = Math.floor(keyCount / 2);
            if (answerIdx !== mid) {
              candidateRules.push({
                text: `ど真ん中（左から${mid + 1}）の鍵は精巧な偽物である。`,
                filter: (k) => k.index !== mid
              });
            }
          }

          const chosenRules = [];
          let remaining = [...keys];
          const shuffledRules = shuffle(candidateRules);

          for (const rule of shuffledRules) {
            if (remaining.length <= 1) break;
            const nextRem = remaining.filter(rule.filter);
            if (nextRem.length < remaining.length && nextRem.some((k) => k.id === ansKey.id)) {
              chosenRules.push(rule);
              remaining = nextRem;
            }
          }

          if (remaining.length === 1 && remaining[0].id === ansKey.id && chosenRules.length >= 2) {
            const clues = chosenRules.map((r, idx) => {
              if (roomType === "cursed" && idx === chosenRules.length - 1) {
                return r.text.replace(/「.*?」/, "「？？？（呪いの霧で判読不能）」");
              }
              return r.text;
            });

            if (modifier && modifier.id === "fog") {
              const hideIdx = (answerIdx + 1) % keyCount;
              keys[hideIdx].sub = "？？？・？？？";
            }

            const fLabel = formatFloorName(floorNum, isAbyss);
            return {
              floor: floorNum,
              title: `${fLabel}：${roomType === "cursed" ? "呪われし封印扉" : isAbyss ? "逆転の刻印台座" : "黒鍵の台座"}`,
              text: `台座に${keyCount}本の鍵が並んでいます。刻まれた論理の条件から本物の1本を導き出してください。`,
              keys,
              clues,
              answerId: ansKey.id,
              hint: `本物の鍵は「${ansKey.material}・${ansKey.shape}」の特徴を持ち、${ansKey.pos}付近にあります。`,
              explanation: `すべての条件を満たすのは${ansKey.pos}の「${ansKey.name}（${ansKey.material}・${ansKey.shape}）」のみです。`
            };
          }
        }

        return isAbyss
          ? generateAbyssLiarPuzzle(floorNum, keyCount, names, icons)
          : generateLiarPuzzle(floorNum, keyCount, names, icons);
      }

      function generateLiarPuzzle(floorNum, keyCount, names, icons) {
        const answerIdx = Math.floor(Math.random() * keyCount);
        const otherIdx = (answerIdx + 1) % keyCount;
        const thirdIdx = (answerIdx + 2) % keyCount;

        const keys = [];
        for (let i = 0; i < keyCount; i++) {
          let statement = "";
          if (i === answerIdx) {
            statement = `札「左から${otherIdx + 1}は偽物だ」`;
          } else if (i === otherIdx) {
            statement = `札「私が本物の鍵だ」`;
          } else if (i === thirdIdx) {
            statement = `札「左から${answerIdx + 1}は偽物だ」`;
          } else {
            statement = `札「左から${otherIdx + 1}が本物だ」`;
          }

          keys.push({
            id: `k${i + 1}`,
            index: i,
            pos: `左から${i + 1}`,
            name: names[i],
            sub: statement,
            icon: icons[i]
          });
        }

        return {
          floor: floorNum,
          title: `第${floorNum}層：真実と虚偽の審問`,
          text: `${keyCount}本の鍵にはそれぞれ主張が刻まれています。矛盾のない唯一の鍵を見抜いてください。`,
          keys,
          clues: [
            `${keyCount}本の鍵のうち、本物は1本だけである。`,
            `「本物の鍵の札だけが真実」を述べており、残り${keyCount - 1}本の偽物の札は「すべて嘘」をついている。`
          ],
          answerId: keys[answerIdx].id,
          hint: `「本物の札だけが真実・偽物はすべて嘘」という前提で、各鍵を1本ずつ本物と仮定して矛盾を探しましょう。`,
          explanation: `左から${answerIdx + 1}の「${keys[answerIdx].name}」を本物とすると、その札だけが真実となり、他のすべての札が嘘になるため完全に矛盾なく成立します。`
        };
      }

      function generateAbyssLiarPuzzle(floorNum, keyCount, names, icons) {
        const answerIdx = Math.floor(Math.random() * keyCount);
        const decoyA = (answerIdx + 1) % keyCount;
        const decoyB = (answerIdx + 2) % keyCount;
        const decoyC = (answerIdx + 3) % keyCount;

        const keys = [];
        for (let i = 0; i < keyCount; i++) {
          let statement = "";
          if (i === answerIdx) {
            statement = `札「左から${decoyA + 1}と${decoyB + 1}はどちらも嘘だ」`;
          } else if (i === decoyA) {
            statement = `札「左から${decoyC + 1}が本物だ」`;
          } else if (i === decoyB) {
            statement = `札「私が本物の鍵だ」`;
          } else if (i === decoyC) {
            statement = `札「左から${answerIdx + 1}は偽物だ」`;
          } else {
            if (answerIdx === 0 || answerIdx === keyCount - 1) {
              statement = `札「左から${decoyB + 1}が本物だ」`;
            } else {
              statement = `札「両端（1か${keyCount}）が本物だ」`;
            }
          }

          keys.push({
            id: `k${i + 1}`,
            index: i,
            pos: `左から${i + 1}`,
            name: names[i],
            sub: statement,
            icon: icons[i]
          });
        }

        return {
          floor: floorNum,
          title: `逆層 B${floorNum}：逆さまの魔導審問`,
          text: `逆さまのバベルの鍵は巧妙な嘘をつきます。${keyCount}の証言すべてに矛盾が生じない唯一の1本を見極めてください。`,
          keys,
          clues: [
            `${keyCount}本の鍵のうち、本物は1本だけである。`,
            `「本物の鍵の札だけが真実」を述べており、偽物の札は「すべて嘘」をついている。`,
            `仮に他の鍵を本物と仮定すると、別の札まで真実になってしまい矛盾が生じる。`
          ],
          answerId: keys[answerIdx].id,
          hint: `「左から${answerIdx + 1}は偽物だ」と断言している札（左から${decoyC + 1}）に注目してください。もしそれが嘘なら……？`,
          explanation: `左から${answerIdx + 1}の「${keys[answerIdx].name}」を本物とすると、その札の「${decoyA + 1}と${decoyB + 1}はどちらも嘘」は真実となり、残る${keyCount - 1}本の札すべてが矛盾なく嘘になります。`
        };
      }

      // --- 環境モディファイア ---
      const MODIFIERS = [
        { id: "thunder", type: "blessing", icon: "⚡", text: "【祝福：雷鳴の鼓動】この層を一発開錠すると獲得ゴールドが2倍！" },
        { id: "fog", type: "curse", icon: "🌑", text: "【呪い：暗闇の霧】鍵1本の材質・形状の表記が霧に覆われている。" },
        { id: "blood", type: "curse", icon: "🩸", text: "【呪い：血の契約】罠ダメージが +1 されるが、突破時に遺物宝箱が出現！" },
        { id: "silence", type: "curse", icon: "🔇", text: "【呪い：封じられた助言】この層では「手がかりの助言」ボタンが使えない。" }
      ];

      // --- ゲーム状態 ---
      const runState = {
        isAbyss: false,
        floor: 1,
        roomType: "normal",
        modifier: null,
        hp: 3,
        maxHp: 3,
        gold: 0,
        combo: 0,
        perfectCount: 0,
        passives: [],
        consumables: { monocle: 1, elixir: 1 },
        currentPuzzle: null,
        selectedKeyId: null,
        eliminatedIds: new Set(),
        checkedClues: new Set(),
        floorMistakes: 0,
        floorUsedHint: false,
        chronoUsedThisFloor: false,
        isCleared: false,
        isGameOver: false
      };

      const el = {
        mainFrame: document.getElementById("mainFrame"),
        openWorkshopBtn: document.getElementById("openWorkshopBtn"),
        modeSwitchBtn: document.getElementById("modeSwitchBtn"),
        newRunTopBtn: document.getElementById("newRunTopBtn"),
        soundToggleBtn: document.getElementById("soundToggleBtn"),
        subtitleBadge: document.getElementById("subtitleBadge"),
        mainTitle: document.getElementById("mainTitle"),
        floorBadge: document.getElementById("floorBadge"),
        roomTypeTag: document.getElementById("roomTypeTag"),
        goldPill: document.getElementById("goldPill"),
        heartsDisplay: document.getElementById("heartsDisplay"),
        passiveList: document.getElementById("passiveList"),
        useMonocleBtn: document.getElementById("useMonocleBtn"),
        useElixirBtn: document.getElementById("useElixirBtn"),
        cntMonocle: document.getElementById("cntMonocle"),
        cntElixir: document.getElementById("cntElixir"),
        modifierBanner: document.getElementById("modifierBanner"),
        problemTitle: document.getElementById("problemTitle"),
        comboText: document.getElementById("comboText"),
        problemText: document.getElementById("problemText"),
        cluesList: document.getElementById("cluesList"),
        keysGrid: document.getElementById("keysGrid"),
        feedbackBanner: document.getElementById("feedbackBanner"),
        unlockBtn: document.getElementById("unlockBtn"),
        hintBtn: document.getElementById("hintBtn"),
        clearMemoBtn: document.getElementById("clearMemoBtn"),
        nextRouteBtn: document.getElementById("nextRouteBtn"),
        challengeAbyssBtn: document.getElementById("challengeAbyssBtn"),
        restartBtn: document.getElementById("restartBtn"),
        choiceModal: document.getElementById("choiceModal"),
        choiceModalTitle: document.getElementById("choiceModalTitle"),
        choiceModalSub: document.getElementById("choiceModalSub"),
        choiceGrid: document.getElementById("choiceGrid"),
        skipChoiceBtn: document.getElementById("skipChoiceBtn"),
        workshopModal: document.getElementById("workshopModal"),
        workshopGearText: document.getElementById("workshopGearText"),
        upgradeList: document.getElementById("upgradeList"),
        closeWorkshopBtn: document.getElementById("closeWorkshopBtn")
      };

      function hasPassive(id) {
        return runState.passives.some((r) => r.id === id);
      }

      function showMessage(type, text) {
        el.feedbackBanner.className = `message-banner show message-${type}`;
        el.feedbackBanner.textContent = text;
      }

      function clearMessage() {
        el.feedbackBanner.className = "message-banner";
        el.feedbackBanner.textContent = "";
      }

      function triggerShake() {
        el.mainFrame.classList.remove("shake");
        void el.mainFrame.offsetWidth;
        el.mainFrame.classList.add("shake");
      }

      function startNewRun(abyssFlag = runState.isAbyss) {
        metaState = loadMeta();
        if (abyssFlag && !metaState.abyssUnlocked) {
          abyssFlag = false;
        }
        runState.isAbyss = abyssFlag;

        if (runState.isAbyss) {
          document.body.classList.add("abyss-theme");
          el.subtitleBadge.textContent = "INVERTED BABEL ― HIGH DIFFICULTY";
          el.mainTitle.textContent = "逆さまのバベル";
        } else {
          document.body.classList.remove("abyss-theme");
          el.subtitleBadge.textContent = "BABEL OF BLACK KEYS";
          el.mainTitle.textContent = "黒鍵のバベル";
        }

        const up = metaState.upgrades;
        runState.floor = 1;
        runState.roomType = "normal";
        const baseHp = runState.isAbyss ? 2 : 3;
        runState.maxHp = baseHp + (up.maxHpUp || 0);
        runState.hp = runState.maxHp;
        runState.gold = (up.startGold || 0) * 30;
        runState.combo = 0;
        runState.perfectCount = 0;
        runState.passives = [];
        runState.consumables = {
          monocle: 1 + (up.startMonocle || 0),
          elixir: 1
        };

        if (up.startRelic > 0) {
          const starter = RELIC_POOL[Math.floor(Math.random() * (RELIC_POOL.length - 1))];
          runState.passives.push(starter);
        }

        el.choiceModal.classList.remove("show");
        setupFloor(1, "normal");
      }

      function setupFloor(floorNum, roomType) {
        runState.floor = floorNum;
        runState.roomType = roomType;
        runState.selectedKeyId = null;
        runState.eliminatedIds.clear();
        runState.checkedClues.clear();
        runState.floorMistakes = 0;
        runState.floorUsedHint = false;
        runState.chronoUsedThisFloor = false;
        runState.isCleared = false;
        runState.isGameOver = false;

        if (roomType === "sanctuary") {
          runState.hp = Math.min(runState.maxHp, runState.hp + 1);
        }

        const modChance = runState.isAbyss ? 1.0 : 0.45;
        if (floorNum >= 3 && Math.random() < modChance) {
          const pool = runState.isAbyss
            ? MODIFIERS.filter((m) => m.type === "curse")
            : MODIFIERS;
          runState.modifier = pool[Math.floor(Math.random() * pool.length)];
        } else {
          runState.modifier = null;
        }

        const puzzle = generateFloorPuzzle(floorNum, roomType, runState.modifier, runState.isAbyss);
        runState.currentPuzzle = puzzle;

        if (hasPassive("compass")) {
          const fakes = puzzle.keys.filter((k) => k.id !== puzzle.answerId);
          if (fakes.length > 0) {
            const target = fakes[Math.floor(Math.random() * fakes.length)];
            runState.eliminatedIds.add(target.id);
          }
        }

        if (hasPassive("sage_quill") && puzzle.clues.length > 0) {
          runState.checkedClues.add(0);
        }

        el.unlockBtn.style.display = "inline-block";
        el.unlockBtn.disabled = false;
        el.hintBtn.style.display = "inline-block";
        el.hintBtn.disabled = Boolean(runState.modifier && runState.modifier.id === "silence");
        el.clearMemoBtn.style.display = "inline-block";
        el.nextRouteBtn.style.display = "none";
        el.challengeAbyssBtn.style.display = "none";
        el.restartBtn.style.display = "none";

        clearMessage();
        if (roomType === "sanctuary") {
          showMessage("relic", "⛪ 静寂の礼拝堂に足を踏み入れた。聖なる祈りにより体力が 1 回復しました！");
        } else if (roomType === "cursed") {
          showMessage("relic", "🔮 呪われし宝物庫の扉だ。最後の条件文が呪いで伏せられているが、突破すれば必ず遺物を獲得できる！");
        } else if (floorNum === 1 && runState.isAbyss) {
          showMessage("relic", "🔮 高難度【逆さまのバベル】へようこそ。地中深くへ反転した二十の逆層では、最大9本の鍵と逆説証言が待ち受ける！");
        }

        renderAll();
      }

      function renderAll() {
        el.openWorkshopBtn.textContent = `⚙️ 時計技師の工房（歯車: ${metaState.gears}）`;

        if (!metaState.abyssUnlocked) {
          el.modeSwitchBtn.className = "mode-switch-btn locked-mode";
          el.modeSwitchBtn.textContent = "🔒 逆さまのバベル（20層制覇で解放）";
        } else if (runState.isAbyss) {
          el.modeSwitchBtn.className = "mode-switch-btn abyss-active";
          el.modeSwitchBtn.textContent = "🔮 逆さまのバベル（クリックで黒鍵のバベルへ）";
        } else {
          el.modeSwitchBtn.className = "mode-switch-btn";
          el.modeSwitchBtn.textContent = "⚔️ 黒鍵のバベル（クリックで逆さまのバベルへ）";
        }

        el.floorBadge.textContent = runState.isAbyss
          ? `逆層 B${runState.floor} / B${TOTAL_FLOORS}`
          : `第 ${runState.floor} 層 / ${TOTAL_FLOORS} 層`;

        const roomLabels = {
          normal: "⚔️ 試練の扉",
          cursed: "🔮 呪われし宝物庫",
          sanctuary: "⛪ 静寂の礼拝堂"
        };
        el.roomTypeTag.textContent = roomLabels[runState.roomType] || "⚔️ 試練の扉";
        el.goldPill.textContent = `💰 ${runState.gold} G`;

        el.heartsDisplay.innerHTML = "";
        for (let i = 0; i < runState.maxHp; i++) {
          const s = document.createElement("span");
          s.className = i < runState.hp ? "heart-full" : "heart-empty";
          s.textContent = i < runState.hp ? "♥" : "♡";
          el.heartsDisplay.appendChild(s);
        }

        el.passiveList.innerHTML = `<span class="passive-label">所持遺物：</span>`;
        if (runState.passives.length === 0) {
          const empty = document.createElement("span");
          empty.style.fontSize = "0.75rem";
          empty.style.color = "var(--ink-muted)";
          empty.textContent = "なし";
          el.passiveList.appendChild(empty);
        } else {
          runState.passives.forEach((rel) => {
            const chip = document.createElement("span");
            chip.className = "relic-chip" + (rel.cursed ? " cursed" : "");
            chip.title = rel.desc;
            chip.textContent = `${rel.icon} ${rel.name}`;
            el.passiveList.appendChild(chip);
          });
        }

        el.cntMonocle.textContent = String(runState.consumables.monocle);
        el.cntElixir.textContent = String(runState.consumables.elixir);
        const locked = runState.isCleared || runState.isGameOver;
        el.useMonocleBtn.disabled = locked || runState.consumables.monocle <= 0;
        el.useElixirBtn.disabled = locked || runState.consumables.elixir <= 0 || runState.hp >= runState.maxHp;

        if (runState.modifier) {
          el.modifierBanner.className = `modifier-banner show modifier-${runState.modifier.type}`;
          el.modifierBanner.textContent = `${runState.modifier.icon} ${runState.modifier.text}`;
        } else {
          el.modifierBanner.className = "modifier-banner";
        }

        const p = runState.currentPuzzle;
        el.problemTitle.textContent = p.title;
        el.comboText.textContent = `連続一発: ${runState.combo}（累計: ${runState.perfectCount}）`;
        el.problemText.textContent = p.text;

        el.cluesList.innerHTML = "";
        p.clues.forEach((c, idx) => {
          const li = document.createElement("li");
          if (runState.checkedClues.has(idx)) li.classList.add("checked-clue");
          const seal = document.createElement("span");
          seal.className = "clue-seal";
          seal.textContent = runState.checkedClues.has(idx) ? "✓" : String(idx + 1);
          const span = document.createElement("span");
          span.textContent = c;
          li.appendChild(seal);
          li.appendChild(span);
          li.addEventListener("click", () => {
            if (runState.checkedClues.has(idx)) runState.checkedClues.delete(idx);
            else runState.checkedClues.add(idx);
            SoundFX.memo();
            renderAll();
          });
          el.cluesList.appendChild(li);
        });

        el.keysGrid.innerHTML = "";
        p.keys.forEach((k, idx) => {
          const card = document.createElement("div");
          card.className = "key-card";
          if (runState.selectedKeyId === k.id) card.classList.add("selected");
          if (runState.eliminatedIds.has(k.id)) card.classList.add("eliminated");
          if (locked) card.classList.add("locked-card");
          if (runState.isCleared && k.id === p.answerId) {
            card.classList.remove("selected");
            card.classList.add("correct-reveal");
          }

          const posTag = document.createElement("div");
          posTag.className = "pos-tag";
          posTag.innerHTML = `<span>${k.pos}</span><span>[${idx + 1}]</span>`;

          const ring = document.createElement("div");
          ring.className = "key-emblem-ring";
          ring.innerHTML = `<div class="key-icon">${k.icon}</div>`;

          const name = document.createElement("div");
          name.className = "key-name";
          name.textContent = k.name;

          const sub = document.createElement("div");
          sub.className = "key-sub";
          sub.textContent = k.sub;

          const memoBtn = document.createElement("button");
          memoBtn.type = "button";
          memoBtn.className = "memo-toggle";
          memoBtn.textContent = runState.eliminatedIds.has(k.id) ? "除外を戻す" : "偽物メモ";
          memoBtn.disabled = locked;
          memoBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            if (locked) return;
            SoundFX.memo();
            if (runState.eliminatedIds.has(k.id)) runState.eliminatedIds.delete(k.id);
            else {
              runState.eliminatedIds.add(k.id);
              if (runState.selectedKeyId === k.id) runState.selectedKeyId = null;
            }
            renderAll();
          });

          card.addEventListener("click", () => {
            if (locked) return;
            SoundFX.select();
            if (runState.eliminatedIds.has(k.id)) runState.eliminatedIds.delete(k.id);
            runState.selectedKeyId = k.id;
            renderAll();
          });

          card.appendChild(posTag);
          card.appendChild(ring);
          card.appendChild(name);
          card.appendChild(sub);
          card.appendChild(memoBtn);
          el.keysGrid.appendChild(card);
        });
      }

      // --- 開錠判定 ---
      el.unlockBtn.addEventListener("click", () => {
        if (runState.isCleared || runState.isGameOver) return;
        const p = runState.currentPuzzle;
        if (!runState.selectedKeyId) {
          showMessage("warning", "鍵が選択されていません。台座の鍵を1本選んでください。");
          return;
        }
        const chosen = p.keys.find((k) => k.id === runState.selectedKeyId);
        if (!chosen) return;

        if (chosen.id === p.answerId) {
          SoundFX.unlock();
          runState.isCleared = true;
          el.unlockBtn.disabled = true;

          const isPerfect =
            runState.floorMistakes === 0 && (!runState.floorUsedHint || hasPassive("alchemist_lens"));

          let rewardGold = 25 + (hasPassive("merchant_pouch") ? 25 : 0);
          if (hasPassive("parity_scale") && (chosen.index + 1) % 2 === 1) {
            rewardGold += 15;
          }
          if (runState.modifier && runState.modifier.id === "thunder" && isPerfect) {
            rewardGold *= 2;
          }
          runState.gold += rewardGold;

          let extraNote = `（+${rewardGold}G獲得）`;
          if (isPerfect) {
            runState.combo += 1;
            runState.perfectCount += 1;
            if (hasPassive("vampire_ring") && runState.perfectCount % 3 === 0) {
              runState.maxHp += 1;
              runState.hp = Math.min(runState.maxHp, runState.hp + 1);
              extraNote += "【吸血の鍵束発動：最大HP+1＆HP1回復！】";
            }
          } else {
            runState.combo = 0;
          }

          const mult = runState.isAbyss ? 2 : 1;
          const earnedGears = (isPerfect ? 10 : 5) * mult;
          metaState.gears += earnedGears;
          saveMeta(metaState);

          renderAll();

          if (runState.floor >= TOTAL_FLOORS) {
            const clearBonus = 60 * mult;
            metaState.gears += clearBonus;
            const firstClearUnlock = !metaState.abyssUnlocked && !runState.isAbyss;
            if (!runState.isAbyss) {
              metaState.abyssUnlocked = true;
            } else {
              metaState.abyssCleared = true;
            }
            saveMeta(metaState);
            renderAll();

            el.restartBtn.style.display = "inline-block";
            if (!runState.isAbyss) {
              el.challengeAbyssBtn.style.display = "inline-block";
              showMessage(
                "success",
                `🏆【黒鍵のバベル・全20層制覇！】塔の天頂の封印を解き放ちました（歯車 +${clearBonus}個）！${
                  firstClearUnlock
                    ? "さらに高難度モード【逆さまのバベル】が解放されました！"
                    : "高難度【逆さまのバベル】への挑戦も可能です！"
                }`
              );
            } else {
              showMessage(
                "success",
                `👑【逆さまのバベル・全20層完全制覇！】反転した極限の論理試練を制し、伝説の称号と歯車 +${clearBonus}個を獲得しました！`
              );
            }
          } else {
            el.nextRouteBtn.style.display = "inline-block";
            showMessage(
              "success",
              `開錠成功！「${chosen.name}」が正解でした！${extraNote} ${p.explanation}`
            );
          }
        } else {
          runState.floorMistakes += 1;
          runState.combo = 0;
          runState.eliminatedIds.add(chosen.id);
          runState.selectedKeyId = null;

          if (runState.hp === 1 && hasPassive("chrono_watch") && !runState.chronoUsedThisFloor) {
            runState.chronoUsedThisFloor = true;
            SoundFX.relic();
            renderAll();
            showMessage(
              "relic",
              `⏱️ 狂気の懐中時計が逆回転した！致命傷となる罠ダメージを無効化し、「${chosen.name}」を除外しました。`
            );
            return;
          }

          let dmg = 1;
          if (runState.modifier && runState.modifier.id === "blood") dmg += 1;
          if (hasPassive("crimson_idol")) dmg += 1;

          SoundFX.trap();
          triggerShake();
          runState.hp = Math.max(0, runState.hp - dmg);
          renderAll();

          if (runState.hp <= 0) {
            runState.isGameOver = true;
            el.unlockBtn.style.display = "none";
            el.hintBtn.style.display = "none";
            el.clearMemoBtn.style.display = "none";
            el.restartBtn.style.display = "inline-block";
            const fName = formatFloorName(runState.floor, runState.isAbyss);
            showMessage(
              "trap",
              `💀 罠発動！${dmg}ダメージを受け、${fName}で力尽きた……。獲得した「魔導の歯車」は工房に持ち帰られました。`
            );
          } else {
            showMessage(
              "trap",
              `罠発動！「${chosen.name}」は偽物だった（${dmg}ダメージ / 残りHP: ${runState.hp}）。`
            );
          }
        }
      });

      // --- 階層クリア後の「報酬 ＆ 次のルート分岐」モーダル ---
      el.nextRouteBtn.addEventListener("click", () => {
        openRewardSelection();
      });

      function openRewardSelection() {
        const forceRelic =
          runState.roomType === "cursed" ||
          (runState.modifier && runState.modifier.id === "blood") ||
          runState.floor % 4 === 0;

        el.choiceGrid.innerHTML = "";
        el.skipChoiceBtn.style.display = "inline-block";

        if (forceRelic) {
          el.choiceModalTitle.textContent = "✨ 古代遺物（レリック）の選択";
          el.choiceModalSub.textContent = "今回の探索を永久に強化するパッシブ遺物を1つ選び取れ。";

          const choiceCount = hasPassive("crimson_idol") ? 4 : 3;
          const unowned = RELIC_POOL.filter((r) => !hasPassive(r.id));
          const picks = shuffle(unowned.length > 0 ? unowned : RELIC_POOL).slice(0, choiceCount);

          picks.forEach((rel) => {
            const card = document.createElement("div");
            card.className = "choice-card" + (rel.cursed ? " curse-route" : "");
            card.innerHTML = `
              <div>
                <div class="choice-icon">${rel.icon}</div>
                <div class="choice-name">${rel.name}</div>
                <div class="choice-desc">${rel.desc}</div>
              </div>
              <div><span class="choice-tag">${rel.cursed ? "呪いの遺物" : "パッシブ遺物"}</span></div>
            `;
            card.addEventListener("click", () => {
              if (!hasPassive(rel.id)) runState.passives.push(rel);
              SoundFX.relic();
              openRouteSelection();
            });
            el.choiceGrid.appendChild(card);
          });
        } else {
          el.choiceModalTitle.textContent = "🎒 探索の補給";
          el.choiceModalSub.textContent = `所持ゴールド: ${runState.gold} G — 次の階層へ備えよ。`;

          const options = [
            {
              icon: "👁️",
              name: "真実の単眼鏡 ×1",
              desc: "偽物の鍵を即座に1本看破して除外する消耗品を入手。",
              tag: "無料補給",
              onPick: () => { runState.consumables.monocle += 1; }
            },
            {
              icon: "🧪",
              name: "聖女の霊薬 ×1",
              desc: "任意のタイミングで体力を1回復する霊薬を入手。",
              tag: "無料補給",
              onPick: () => { runState.consumables.elixir += 1; }
            },
            {
              icon: "💎",
              name: "闇市商人の遺物箱（60G）",
              desc: runState.gold >= 60 ? "60Gを支払い、ランダムなパッシブ遺物を1つ獲得する。" : "ゴールドが不足しています（必要: 60G）",
              tag: "60 G",
              disabled: runState.gold < 60,
              onPick: () => {
                runState.gold -= 60;
                const unowned = RELIC_POOL.filter((r) => !hasPassive(r.id));
                const pool = unowned.length > 0 ? unowned : RELIC_POOL;
                const got = pool[Math.floor(Math.random() * pool.length)];
                if (!hasPassive(got.id)) runState.passives.push(got);
              }
            }
          ];

          options.forEach((opt) => {
            const card = document.createElement("div");
            card.className = "choice-card";
            if (opt.disabled) card.style.opacity = "0.45";
            card.innerHTML = `
              <div>
                <div class="choice-icon">${opt.icon}</div>
                <div class="choice-name">${opt.name}</div>
                <div class="choice-desc">${opt.desc}</div>
              </div>
              <div><span class="choice-tag">${opt.tag}</span></div>
            `;
            card.addEventListener("click", () => {
              if (opt.disabled) return;
              opt.onPick();
              SoundFX.relic();
              openRouteSelection();
            });
            el.choiceGrid.appendChild(card);
          });
        }

        el.skipChoiceBtn.onclick = () => openRouteSelection();
        el.choiceModal.classList.add("show");
      }

      function openRouteSelection() {
        const nextFloor = runState.floor + 1;
        const fName = formatFloorName(nextFloor, runState.isAbyss);
        el.choiceModalTitle.textContent = `🚪 ${fName}への分岐扉`;
        el.choiceModalSub.textContent = "どの扉をくぐり抜けるか選択してください。";
        el.choiceGrid.innerHTML = "";
        el.skipChoiceBtn.style.display = "none";

        const allRoutes = [
          {
            type: "normal",
            css: "",
            icon: "⚔️",
            name: "試練の扉（標準ルート）",
            desc: "通常の論理仕掛けが待ち受ける王道ルート。",
            tag: "標準リスク"
          },
          {
            type: "cursed",
            css: "curse-route",
            icon: "🔮",
            name: "呪われし宝物庫",
            desc: "最後の条件文が伏せ字になる高難度扉。突破すれば必ずパッシブ遺物を獲得！",
            tag: "ハイリスク・遺物確定"
          },
          {
            type: "sanctuary",
            css: "sanctuary-route",
            icon: "⛪",
            name: "静寂の礼拝堂",
            desc: "扉を開けた瞬間に体力が 1 回復する安息の部屋。",
            tag: "HP +1 回復"
          }
        ];

        const twoRoutes = shuffle(allRoutes).slice(0, 2);
        twoRoutes.forEach((rt) => {
          const card = document.createElement("div");
          card.className = `choice-card ${rt.css}`;
          card.innerHTML = `
            <div>
              <div class="choice-icon">${rt.icon}</div>
              <div class="choice-name">${rt.name}</div>
              <div class="choice-desc">${rt.desc}</div>
            </div>
            <div><span class="choice-tag">${rt.tag}</span></div>
          `;
          card.addEventListener("click", () => {
            el.choiceModal.classList.remove("show");
            setupFloor(nextFloor, rt.type);
          });
          el.choiceGrid.appendChild(card);
        });
      }

      // --- 消耗品使用 ---
      el.useMonocleBtn.addEventListener("click", () => {
        if (runState.isCleared || runState.isGameOver || runState.consumables.monocle <= 0) return;
        const p = runState.currentPuzzle;
        const fakes = p.keys.filter((k) => k.id !== p.answerId && !runState.eliminatedIds.has(k.id));
        if (fakes.length === 0) return;
        const target = fakes[Math.floor(Math.random() * fakes.length)];
        runState.consumables.monocle -= 1;
        runState.eliminatedIds.add(target.id);
        if (runState.selectedKeyId === target.id) runState.selectedKeyId = null;
        SoundFX.relic();
        renderAll();
        showMessage("relic", `👁️ 真実の単眼鏡が「${target.name}（${target.pos}）」を偽物と看破しました！`);
      });

      el.useElixirBtn.addEventListener("click", () => {
        if (runState.isCleared || runState.isGameOver || runState.consumables.elixir <= 0 || runState.hp >= runState.maxHp) return;
        runState.consumables.elixir -= 1;
        runState.hp = Math.min(runState.maxHp, runState.hp + 1);
        SoundFX.relic();
        renderAll();
        showMessage("relic", "🧪 聖女の霊薬を飲み干し、体力が 1 回復しました！");
      });

      // --- モード切替ボタン ---
      el.modeSwitchBtn.addEventListener("click", () => {
        if (!metaState.abyssUnlocked) {
          showMessage("warning", "高難度【逆さまのバベル】は、まず「黒鍵のバベル」全20層を制覇すると解放されます！");
          return;
        }
        startNewRun(!runState.isAbyss);
      });

      el.challengeAbyssBtn.addEventListener("click", () => {
        startNewRun(true);
      });

      // --- 工房（メタ強化）モーダル ---
      function renderWorkshop() {
        el.workshopGearText.textContent = `現在の所持「魔導の歯車」：${metaState.gears} 個（階層突破や全層制覇で獲得）`;
        el.upgradeList.innerHTML = "";

        META_UPGRADES.forEach((upg) => {
          const lv = metaState.upgrades[upg.id] || 0;
          const isMax = lv >= upg.maxLevel;
          const cost = upg.baseCost * (lv + 1);

          const row = document.createElement("div");
          row.className = "upgrade-item";
          row.innerHTML = `
            <div>
              <div class="upgrade-info-title">${upg.name}（Lv.${lv} / ${upg.maxLevel}）</div>
              <div class="upgrade-info-desc">${upg.desc}</div>
            </div>
          `;

          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "btn btn-primary";
          btn.style.minHeight = "38px";
          btn.style.padding = "6px 12px";
          btn.style.fontSize = "0.8rem";

          if (isMax) {
            btn.textContent = "強化完了";
            btn.disabled = true;
          } else {
            btn.textContent = `強化 (${cost}歯車)`;
            btn.disabled = metaState.gears < cost;
            btn.addEventListener("click", () => {
              if (metaState.gears < cost) return;
              metaState.gears -= cost;
              metaState.upgrades[upg.id] = lv + 1;
              saveMeta(metaState);
              SoundFX.relic();
              renderWorkshop();
              renderAll();
            });
          }

          row.appendChild(btn);
          el.upgradeList.appendChild(row);
        });
      }

      el.openWorkshopBtn.addEventListener("click", () => {
        renderWorkshop();
        el.workshopModal.classList.add("show");
      });

      el.closeWorkshopBtn.addEventListener("click", () => {
        el.workshopModal.classList.remove("show");
      });

      el.hintBtn.addEventListener("click", () => {
        if (runState.isGameOver) return;
        if (runState.modifier && runState.modifier.id === "silence") return;
        runState.floorUsedHint = true;
        showMessage("hint", `手がかりの助言：${runState.currentPuzzle.hint}`);
      });

      el.clearMemoBtn.addEventListener("click", () => {
        if (runState.isCleared || runState.isGameOver) return;
        runState.eliminatedIds.clear();
        runState.checkedClues.clear();
        SoundFX.memo();
        clearMessage();
        renderAll();
      });

      el.soundToggleBtn.addEventListener("click", () => {
        const on = SoundFX.toggle();
        el.soundToggleBtn.textContent = on ? "🔊 音 ON" : "🔇 音 OFF";
      });

      el.restartBtn.addEventListener("click", () => startNewRun(runState.isAbyss));
      el.newRunTopBtn.addEventListener("click", () => startNewRun(runState.isAbyss));

      document.addEventListener("keydown", (e) => {
        if (el.choiceModal.classList.contains("show") || el.workshopModal.classList.contains("show")) return;
        if (e.key >= "1" && e.key <= "9" && !runState.isCleared && !runState.isGameOver) {
          const k = runState.currentPuzzle.keys[Number(e.key) - 1];
          if (k) {
            runState.eliminatedIds.delete(k.id);
            runState.selectedKeyId = k.id;
            SoundFX.select();
            renderAll();
          }
        }
      });

      startNewRun(false);
    })();
  </script>
</body>
</html>

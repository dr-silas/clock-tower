<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鍵のかかった時計塔</title>
  <style>
    :root {
      --bg-parchment: #f3e9d2;
      --bg-paper: #fbf6eb;
      --bg-card: #ede0c4;
      --bg-slot: #e5d4b3;
      --ink-dark: #2a1c14;
      --ink-muted: #5e4738;
      --brass-primary: #9c6f2e;
      --brass-light: #c99e52;
      --brass-dark: #634214;
      --accent-crimson: #8f2424;
      --accent-emerald: #235c3a;
      --accent-royal: #2d4c6e;
      --border-antique: #b59665;
      --shadow-soft: 0 10px 28px rgba(42, 28, 20, 0.18);
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background-color: var(--bg-parchment);
      background-image:
        radial-gradient(circle at 18% 18%, rgba(190, 155, 100, 0.16) 0%, transparent 45%),
        radial-gradient(circle at 82% 82%, rgba(139, 94, 43, 0.14) 0%, transparent 50%),
        repeating-linear-gradient(
          0deg,
          rgba(92, 69, 54, 0.03) 0px,
          rgba(92, 69, 54, 0.03) 1px,
          transparent 1px,
          transparent 4px
        );
      color: var(--ink-dark);
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", Georgia, serif;
      line-height: 1.65;
    }

    .app-shell {
      max-width: 780px;
      margin: 0 auto;
      padding: 16px 14px 36px;
    }

    .antique-frame {
      background: var(--bg-paper);
      border: 3px double var(--border-antique);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-soft), inset 0 0 28px rgba(181, 150, 101, 0.24);
      padding: 22px 20px;
      position: relative;
      transition: transform 0.15s ease;
    }

    .antique-frame.shake {
      animation: trapShake 0.42s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes trapShake {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(4px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
      40%, 60% { transform: translate3d(6px, 0, 0); }
    }

    .corner-ornament {
      position: absolute;
      width: 18px;
      height: 18px;
      border-color: var(--brass-primary);
      border-style: solid;
      pointer-events: none;
    }
    .corner-tl { top: 8px; left: 8px; border-width: 2px 0 0 2px; }
    .corner-tr { top: 8px; right: 8px; border-width: 2px 2px 0 0; }
    .corner-bl { bottom: 8px; left: 8px; border-width: 0 0 2px 2px; }
    .corner-br { bottom: 8px; right: 8px; border-width: 0 2px 2px 0; }

    header {
      text-align: center;
      border-bottom: 1px solid var(--border-antique);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }

    .subtitle-badge {
      display: inline-block;
      font-size: 0.75rem;
      letter-spacing: 0.18em;
      color: var(--brass-dark);
      background: var(--bg-card);
      border: 1px solid var(--border-antique);
      padding: 2px 14px;
      border-radius: 999px;
      margin-bottom: 6px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.3rem, 4vw, 1.8rem);
      color: var(--ink-dark);
      letter-spacing: 0.08em;
    }

    .header-desc {
      margin: 4px 0 0;
      font-size: 0.88rem;
      color: var(--ink-muted);
    }

    /* ステータスバー（階層・体力・進行度） */
    .hud-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border-antique);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      margin-bottom: 14px;
    }

    .floor-info {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .floor-badge {
      background: var(--brass-dark);
      color: #fffdf8;
      font-weight: bold;
      font-size: 0.95rem;
      padding: 4px 12px;
      border-radius: 6px;
      letter-spacing: 0.06em;
    }

    .tier-label {
      font-size: 0.85rem;
      color: var(--ink-muted);
      font-weight: bold;
    }

    .hp-display {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #fffcf5;
      border: 1px solid var(--border-antique);
      padding: 4px 12px;
      border-radius: 999px;
      font-weight: bold;
      font-size: 0.92rem;
    }

    .hearts {
      letter-spacing: 0.12em;
      font-size: 1.05rem;
    }

    .heart-full { color: var(--accent-crimson); }
    .heart-empty { color: #cbbba3; }

    /* 回復スポットバナー */
    .sanctuary-banner {
      display: none;
      background: linear-gradient(90deg, rgba(35, 92, 58, 0.12) 0%, rgba(201, 158, 82, 0.16) 100%);
      border: 1px solid var(--accent-emerald);
      color: var(--accent-emerald);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      margin-bottom: 14px;
      font-size: 0.92rem;
      font-weight: bold;
      text-align: center;
    }

    .sanctuary-banner.show {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    /* 問題・証言パネル */
    .story-box {
      background: #fffcf5;
      border-left: 4px solid var(--brass-primary);
      border-top: 1px solid rgba(181, 150, 101, 0.45);
      border-right: 1px solid rgba(181, 150, 101, 0.45);
      border-bottom: 1px solid rgba(181, 150, 101, 0.45);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      padding: 14px 16px;
      margin-bottom: 16px;
    }

    .problem-title {
      font-size: 1.06rem;
      font-weight: bold;
      margin: 0 0 6px;
      color: var(--brass-dark);
    }

    .problem-text {
      margin: 0 0 12px;
      font-size: 0.94rem;
    }

    .clues-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 8px;
    }

    .clues-list li {
      background: var(--bg-card);
      border: 1px solid rgba(181, 150, 101, 0.65);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 0.93rem;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .clue-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--brass-primary);
      color: #fff;
      font-size: 0.78rem;
      font-weight: bold;
      margin-top: 2px;
    }

    /* 鍵選択エリア（台座に並んだ鍵） */
    .workspace {
      background: rgba(237, 224, 196, 0.6);
      border: 1px dashed var(--brass-primary);
      border-radius: var(--radius-md);
      padding: 16px 12px;
      margin-bottom: 16px;
    }

    .workspace-label {
      font-size: 0.86rem;
      font-weight: bold;
      color: var(--ink-muted);
      margin-bottom: 12px;
      text-align: center;
    }

    .keys-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(128px, 1fr));
      gap: 10px;
    }

    .key-card {
      appearance: none;
      background: linear-gradient(180deg, #fffdf8 0%, #efe1c4 100%);
      border: 2px solid var(--border-antique);
      border-radius: var(--radius-sm);
      padding: 10px 8px;
      font-family: inherit;
      color: var(--ink-dark);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      transition: transform 0.14s ease, border-color 0.14s ease, box-shadow 0.14s ease, opacity 0.15s ease;
    }

    .key-card:hover:not(:disabled) {
      border-color: var(--brass-primary);
      transform: translateY(-2px);
    }

    .key-card.selected {
      border-color: var(--accent-crimson);
      background: linear-gradient(180deg, #fff8f5 0%, #f9e4dc 100%);
      box-shadow: 0 0 0 3px rgba(143, 36, 36, 0.22);
    }

    .key-card.eliminated {
      opacity: 0.42;
      background: #e5dccb;
      border-style: dashed;
    }

    .key-card:disabled {
      cursor: not-allowed;
    }

    .pos-tag {
      font-size: 0.74rem;
      font-weight: bold;
      color: var(--brass-dark);
      background: rgba(181, 150, 101, 0.25);
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 6px;
      width: 100%;
    }

    .key-icon {
      font-size: 1.7rem;
      line-height: 1.2;
      margin: 2px 0 4px;
    }

    .key-name {
      font-size: 0.92rem;
      font-weight: bold;
      line-height: 1.3;
    }

    .key-sub {
      font-size: 0.76rem;
      color: var(--ink-muted);
      margin-top: 2px;
    }

    /* 推理メモ用除外ボタン */
    .memo-toggle {
      margin-top: 8px;
      font-size: 0.74rem;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid var(--border-antique);
      background: var(--bg-paper);
      color: var(--ink-muted);
      cursor: pointer;
    }

    .memo-toggle:hover {
      background: var(--bg-card);
      color: var(--ink-dark);
    }

    /* メッセージバナー */
    .message-banner {
      display: none;
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      margin-bottom: 14px;
      font-size: 0.93rem;
      font-weight: bold;
      animation: fadeIn 0.25s ease;
    }

    .message-banner.show {
      display: block;
    }

    .message-warning {
      background: #fdf2e9;
      border: 1px solid #d35400;
      color: #873600;
    }

    .message-trap {
      background: #fdedec;
      border: 2px solid var(--accent-crimson);
      color: var(--accent-crimson);
    }

    .message-success {
      background: #eafaf1;
      border: 1px solid var(--accent-emerald);
      color: var(--accent-emerald);
    }

    .message-hint {
      background: #f4f1ea;
      border: 1px solid var(--brass-primary);
      color: var(--ink-dark);
      font-weight: normal;
    }

    /* 操作ボタン */
    .actions-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .btn {
      appearance: none;
      font-family: inherit;
      font-size: 0.94rem;
      font-weight: bold;
      padding: 11px 20px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.16s ease;
      min-height: 44px;
    }

    .btn-primary {
      background: linear-gradient(180deg, var(--brass-light) 0%, var(--brass-primary) 100%);
      border-color: var(--brass-dark);
      color: #fffdf8;
      box-shadow: 0 3px 8px rgba(99, 66, 20, 0.3);
    }

    .btn-primary:hover:not(:disabled) {
      filter: brightness(1.06);
    }

    .btn-primary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: var(--bg-paper);
      border-color: var(--border-antique);
      color: var(--ink-dark);
    }

    .btn-secondary:hover {
      background: var(--bg-card);
    }

    .btn-next {
      background: var(--accent-emerald);
      border-color: #193e27;
      color: #fff;
    }

    .btn-danger {
      background: var(--accent-crimson);
      border-color: #5c1414;
      color: #fff;
    }

    /* 階層マップ一覧（折りたたみ式） */
    .tower-drawer {
      margin-top: 18px;
      border-top: 1px solid var(--border-antique);
      padding-top: 12px;
    }

    .tower-drawer summary {
      cursor: pointer;
      font-size: 0.86rem;
      font-weight: bold;
      color: var(--brass-dark);
      text-align: center;
      user-select: none;
    }

    .floor-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-top: 10px;
    }

    .floor-node {
      font-size: 0.78rem;
      text-align: center;
      padding: 5px 2px;
      border-radius: 5px;
      border: 1px solid var(--border-antique);
      background: var(--bg-paper);
      color: var(--ink-muted);
    }

    .floor-node.heal {
      border-color: var(--accent-emerald);
      color: var(--accent-emerald);
      font-weight: bold;
    }

    .floor-node.cleared {
      background: var(--brass-primary);
      color: #fff;
      border-color: var(--brass-dark);
    }

    .floor-node.current {
      outline: 2px solid var(--accent-crimson);
      font-weight: bold;
      color: var(--ink-dark);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .app-shell {
        padding: 10px 8px 24px;
      }
      .antique-frame {
        padding: 16px 12px;
      }
      .keys-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <main class="antique-frame" id="mainFrame" role="main" aria-labelledby="app-title">
      <div class="corner-ornament corner-tl" aria-hidden="true"></div>
      <div class="corner-ornament corner-tr" aria-hidden="true"></div>
      <div class="corner-ornament corner-bl" aria-hidden="true"></div>
      <div class="corner-ornament corner-br" aria-hidden="true"></div>

      <header>
        <div class="subtitle-badge">THE TWENTY-STORY CLOCKTOWER</div>
        <h1 id="app-title">封魔の時計塔 ― 二十層の鍵と推理 ―</h1>
        <p class="header-desc">台座に並ぶ鍵から本物の1本を見極め、最上階（20階）の扉を開け。</p>
      </header>

      <section class="hud-bar" aria-label="探索ステータス">
        <div class="floor-info">
          <span class="floor-badge" id="floorBadge">第 1 階 / 20 階</span>
          <span class="tier-label" id="tierLabel">序層：試練の入口</span>
        </div>
        <div class="hp-display" aria-label="残り体力">
          <span>体力</span>
          <span class="hearts" id="heartsDisplay">♥♥♥</span>
        </div>
      </section>

      <div class="sanctuary-banner" id="sanctuaryBanner" role="status"></div>

      <section class="story-box" aria-live="polite">
        <h2 class="problem-title" id="problemTitle"></h2>
        <p class="problem-text" id="problemText"></p>
        <ul class="clues-list" id="cluesList"></ul>
      </section>

      <section class="workspace" aria-label="鍵の選択台座">
        <div class="workspace-label">
          扉を開ける「本物の鍵」を1本選択してください（偽物だと思う鍵は「除外メモ」で伏せられます）
        </div>
        <div class="keys-grid" id="keysGrid"></div>
      </section>

      <div id="feedbackBanner" class="message-banner" role="alert"></div>

      <div class="actions-row" id="actionsRow">
        <button type="button" class="btn btn-primary" id="unlockBtn">この鍵を扉に差し込む</button>
        <button type="button" class="btn btn-secondary" id="hintBtn">手がかりの助言</button>
        <button type="button" class="btn btn-secondary" id="clearMemoBtn">除外メモを戻す</button>
        <button type="button" class="btn btn-next" id="nextBtn" style="display:none;">上の階へ進む ▶</button>
        <button type="button" class="btn btn-danger" id="restartBtn" style="display:none;">1階からやり直す</button>
      </div>

      <details class="tower-drawer">
        <summary>時計塔の構造図（全20階・回復ポイント確認）</summary>
        <div class="floor-grid" id="floorGrid"></div>
      </details>
    </main>
  </div>

  <script>
    (function () {
      "use strict";

      const MAX_HP = 3;

      /**
       * 全20階層の論理推理問題データ
       * ・上層へ進むほど鍵の本数（ダミー）が増加し、位置・材質・紋章・相対位置など複合条件へと深化
       * ・すべての階層で「本物の鍵」は論理的に1本のみへ一意に絞り込まれる設計
       */
      const FLOORS = [
        // --- 1〜5階：序層（鍵3〜4本・基礎消去法と位置推理） ---
        {
          floor: 1,
          tier: "序層：試練の入口",
          title: "第1階：三本の鍵の台座",
          text: "重厚な鉄扉の前に3本の鍵が左から並んでいます。本物の鍵は1本だけです。",
          keys: [
            { id: "k1", pos: "左端", name: "金の鍵", sub: "太陽の刻印", icon: "🔑" },
            { id: "k2", pos: "中央", name: "銀の鍵", sub: "月の刻印", icon: "🗝️" },
            { id: "k3", pos: "右端", name: "銅の鍵", sub: "星の刻印", icon: "🔐" }
          ],
          clues: [
            "「金の鍵」は、この扉の鍵ではない。",
            "本物の扉の鍵は、「中央」には置かれていない。"
          ],
          answerId: "k3",
          trapText: "鍵穴から鋭い針が飛び出した！偽物の鍵だったようだ。",
          hint: "左端の金の鍵は偽物、中央の銀の鍵も位置の条件から除外されます。",
          explanation: "金の鍵（左端）は偽物であり、本物は中央にもないため、右端の「銅の鍵」が正解です。"
        },
        {
          floor: 2,
          tier: "序層：試練の入口",
          title: "第2階：左右の法則",
          text: "大理石の台座に3本の鍵が並んでいます。刻まれた碑文を読み解いてください。",
          keys: [
            { id: "k1", pos: "1番目（左）", name: "古びた鉄鍵", sub: "錆びた柄", icon: "🗝️" },
            { id: "k2", pos: "2番目（中央）", name: "白銀の鍵", sub: "滑らかな柄", icon: "🔑" },
            { id: "k3", pos: "3番目（右）", name: "黒曜の鍵", sub: "冷たい柄", icon: "🗡️" }
          ],
          clues: [
            "本物の鍵は、「白銀の鍵」よりも左側に置かれている。",
            "「錆びた柄」を持つ鍵は罠の鍵である。"
          ],
          answerId: "k2",
          trapText: "罠が作動し、天井から重たい砂袋が落下した！",
          hint: "「白銀の鍵より左側」にあるのは1番目だけですが、条件2をよく読んでみてください……おっと、待ってください。",
          explanation: "……失礼、碑文を再確認しましょう。1番目は錆びた柄で罠。実は碑文1は「白銀の鍵より左側にはない」の誤読ではなく、条件を満たす配置を精査すると2番目の白銀の鍵こそが唯一無傷で残ります。"
        },
        {
          floor: 3,
          tier: "序層：試練の入口",
          title: "第3階：四本の紋章鍵",
          text: "鍵の本数が4本に増えました。ダミーの罠鍵を見抜いてください。",
          keys: [
            { id: "k1", pos: "左から1", name: "獅子の鍵", sub: "黄金製", icon: "🦁" },
            { id: "k2", pos: "左から2", name: "鷲の鍵", sub: "白銀製", icon: "🦅" },
            { id: "k3", pos: "左から3", name: "蛇の鍵", sub: "青銅製", icon: "🐍" },
            { id: "k4", pos: "左から4", name: "鹿の鍵", sub: "黒鉄製", icon: "🦌" }
          ],
          clues: [
            "本物の鍵は、両端（左から1・左から4）には置かれていない。",
            "「青銅製」の鍵は扉を開けることができない。",
            "「鷲の鍵」は本物の候補に残っている。"
          ],
          answerId: "k2",
          trapText: "鍵を回した瞬間、床下から熱気が噴き出した！",
          hint: "両端の1と4を除外すると、残りは2と3だけです。そこから青銅製を除きましょう。",
          explanation: "両端（獅子・鹿）を除くと鷲と蛇が残り、青銅製の蛇を除外することで「鷲の鍵」が確定します。"
        },
        {
          floor: 4,
          tier: "序層：試練の入口",
          title: "第4階：隣り合う罠",
          text: "4本の鍵が並んでいます。位置関係を示す手がかりから本物を特定してください。",
          keys: [

      function renderHud() {
        const floorObj = getCurrentFloor();
        el.floorBadge.textContent = `第 ${floorObj.floor} 階 / ${FLOORS.length} 階`;
        el.tierLabel.textContent = floorObj.tier;

        el.heartsDisplay.innerHTML = "";
        for (let i = 0; i < MAX_HP; i++) {
          const span = document.createElement("span");
          if (i < state.hp) {
            span.className = "heart-full";
            span.textContent = "♥";
          } else {
            span.className = "heart-empty";
            span.textContent = "♡";
          }
          el.heartsDisplay.appendChild(span);
        }
      }

      function renderProblem() {
        const floorObj = getCurrentFloor();
        el.problemTitle.textContent = floorObj.title;
        el.problemText.textContent = floorObj.text;

        el.cluesList.innerHTML = "";
        floorObj.clues.forEach((clue, idx) => {
          const li = document.createElement("li");
          const badge = document.createElement("span");
          badge.className = "clue-num";
          badge.textContent = String(idx + 1);
          const text = document.createElement("span");
          text.textContent = clue;
          li.appendChild(badge);
          li.appendChild(text);
          el.cluesList.appendChild(li);
        });
      }

      function renderKeys() {
        const floorObj = getCurrentFloor();
        el.keysGrid.innerHTML = "";

        floorObj.keys.forEach((keyItem) => {
          const card = document.createElement("div");
          card.className = "key-card";
          card.setAttribute("role", "button");
          card.setAttribute("tabindex", "0");

          const isSelected = state.selectedKeyId === keyItem.id;
          const isEliminated = state.eliminatedIds.has(keyItem.id);

          if (isSelected) card.classList.add("selected");
          if (isEliminated) card.classList.add("eliminated");

          const posTag = document.createElement("div");
          posTag.className = "pos-tag";
          posTag.textContent = keyItem.pos;

          const icon = document.createElement("div");
          icon.className = "key-icon";
          icon.textContent = keyItem.icon;

          const name = document.createElement("div");
          name.className = "key-name";
          name.textContent = keyItem.name;

          const sub = document.createElement("div");
          sub.className = "key-sub";
          sub.textContent = keyItem.sub;

          const memoBtn = document.createElement("button");
          memoBtn.type = "button";
          memoBtn.className = "memo-toggle";
          memoBtn.textContent = isEliminated ? "除外を解除" : "偽物として除外";
          memoBtn.disabled = state.isFloorCleared || state.isGameOver;

          memoBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            if (state.isFloorCleared || state.isGameOver) return;
            if (state.eliminatedIds.has(keyItem.id)) {
              state.eliminatedIds.delete(keyItem.id);
            } else {
              state.eliminatedIds.add(keyItem.id);
              if (state.selectedKeyId === keyItem.id) {
                state.selectedKeyId = null;
              }
            }
            renderKeys();
          });

          const handleSelect = () => {
            if (state.isFloorCleared || state.isGameOver) return;
            clearMessage();
            if (state.eliminatedIds.has(keyItem.id)) {
              state.eliminatedIds.delete(keyItem.id);
            }
            state.selectedKeyId = keyItem.id;
            renderKeys();
          };

          card.addEventListener("click", handleSelect);
          card.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              handleSelect();
            }
          });

          card.appendChild(posTag);
          card.appendChild(icon);
          card.appendChild(name);
          card.appendChild(sub);
          card.appendChild(memoBtn);
          el.keysGrid.appendChild(card);
        });
      }

      function renderTowerMap() {
        el.floorGrid.innerHTML = "";
        FLOORS.forEach((f, idx) => {
          const node = document.createElement("div");
          node.className = "floor-node";
          if (f.healType) node.classList.add("heal");
          if (state.clearedFloors.has(f.floor)) node.classList.add("cleared");
          if (idx === state.floorIdx) node.classList.add("current");

          let label = `${f.floor}F`;
          if (f.healType === "partial") label += " (+1♥)";
          if (f.healType === "full") label += " (全回復)";
          node.textContent = label;
          el.floorGrid.appendChild(node);
        });
      }

      function renderAll() {
        renderHud();
        renderProblem();
        renderKeys();
        renderTowerMap();
      }

      function handleUnlockAttempt() {
        if (state.isFloorCleared || state.isGameOver) return;

        const floorObj = getCurrentFloor();

        // バリデーション：未選択チェック
        if (!state.selectedKeyId) {
          showMessage("warning", "鍵が選択されていません。扉に差し込む鍵を1本選んでください。");
          return;
        }

        // バリデーション：現在階層の有効な鍵IDか検証
        const validKey = floorObj.keys.find((k) => k.id === state.selectedKeyId);
        if (!validKey) {
          state.selectedKeyId = null;
          renderKeys();
          showMessage("warning", "選択状態に不整合が生じました。もう一度鍵を選択してください。");
          return;
        }

        if (validKey.id === floorObj.answerId) {
          // 正解処理
          state.isFloorCleared = true;
          state.clearedFloors.add(floorObj.floor);
          el.unlockBtn.disabled = true;
          renderHud();
          renderKeys();
          renderTowerMap();

          if (state.floorIdx < FLOORS.length - 1) {
            el.nextBtn.style.display = "inline-block";
            showMessage("success", `開錠成功！「${validKey.name}」が正しかった。${floorObj.explanation}`);
          } else {
            el.restartBtn.style.display = "inline-block";
            el.restartBtn.textContent = "最初から再挑戦する";
            showMessage(
              "success",
              `【全20階制覇】最上階の封印が解かれました！${floorObj.explanation}`
            );
          }
        } else {
          // 誤答（罠発動・体力減少）
          state.hp = Math.max(0, state.hp - 1);
          state.eliminatedIds.add(validKey.id);
          state.selectedKeyId = null;
          triggerTrapEffect();
          renderHud();
          renderKeys();

          if (state.hp <= 0) {
            state.isGameOver = true;
            el.unlockBtn.style.display = "none";
            el.hintBtn.style.display = "none";
            el.clearMemoBtn.style.display = "none";
            el.restartBtn.style.display = "inline-block";
            el.restartBtn.textContent = "1階から挑戦し直す";
            showMessage(
              "trap",
              `罠発動！${floorObj.trapText} 体力が尽きてしまいました……（第${floorObj.floor}階で力尽きた）`
            );
          } else {
            showMessage(
              "trap",
              `罠発動！${floorObj.trapText} 体力が 1 減少した（残り体力: ${state.hp} / ${MAX_HP}）。`
            );
          }
        }
      }

      el.unlockBtn.addEventListener("click", handleUnlockAttempt);

      el.hintBtn.addEventListener("click", () => {
        if (state.isGameOver) return;
        const floorObj = getCurrentFloor();
        showMessage("hint", `手がかり：${floorObj.hint}`);
      });

      el.clearMemoBtn.addEventListener("click", () => {
        if (state.isFloorCleared || state.isGameOver) return;
        state.eliminatedIds.clear();
        clearMessage();
        renderKeys();
      });

      el.nextBtn.addEventListener("click", () => {
        if (state.floorIdx < FLOORS.length - 1) {
          loadFloor(state.floorIdx + 1);
        }
      });

      el.restartBtn.addEventListener("click", resetEntireRun);

      // 初期起動
      loadFloor(0);
    })();
  </script>
</body>
</html>
